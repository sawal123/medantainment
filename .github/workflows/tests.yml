name: Laravel Security & Authorization Tests

on:
  push:
    branches:
      - main
      - fix/security-hardening
      - fix/upload-url-orphan-hardening
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: false
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3 Production Platform
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite, ctype, curl, iconv, json, openssl, pdo, tokenizer, xml, zip
          coverage: none

      - name: Copy Environment Configuration
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Validate Composer Package Configuration
        run: composer validate --strict

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Check Platform Requirements
        run: composer check-platform-reqs

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Clear Application Optimization Cache
        run: php artisan optimize:clear

      - name: Display Application Information
        run: php artisan about

      - name: Run Automated Test Suite
        run: php artisan test

      - name: Run Security Audit
        run: composer audit
